<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Immune Front renderer harness</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1a0a18;
      }
      #stage {
        position: absolute;
        inset: 0;
      }
      .mock-bar {
        position: absolute;
        left: 0;
        right: 0;
        z-index: 5;
        pointer-events: none;
        background: rgba(20, 8, 20, 0.55);
        border-color: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(6px);
      }
      .mock-bar.top {
        top: 0;
        height: 104px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      }
      .mock-bar.bottom {
        bottom: 0;
        height: 132px;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
      }
      body.light .mock-bar {
        background: rgba(255, 255, 255, 0.55);
      }
      #hud {
        position: absolute;
        left: 6px;
        bottom: 140px;
        z-index: 10;
        font: 11px/1.3 ui-monospace, monospace;
        color: #fff;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div class="mock-bar top"></div>
    <div class="mock-bar bottom"></div>
    <div id="hud"></div>
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
